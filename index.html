<!DOCTYPE html>
<!-- Version 11 — see README.md changelog for what changed in this version -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Family Intake</title>
<style>
  :root{
    --bg:#F3F5F4; --card:#FFFFFF; --ink:#22302D; --soft:#5C6B67;
    --accent:#22685C; --accent-ink:#FFFFFF; --accent-soft:#E3EEEB;
    --line:#D7DEDB; --chip:#EEF2F1; --good:#2E7D4F; --warn:#8A5A00;
    --radius:14px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{background:var(--bg); color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    font-size:17px; line-height:1.45; -webkit-font-smoothing:antialiased;}
  #app{max-width:720px; margin:0 auto; padding:20px 16px 60px;}
  .brand{font-size:13px; letter-spacing:.14em; text-transform:uppercase; color:var(--soft); margin:6px 2px 14px;}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:26px 22px; box-shadow:0 1px 2px rgba(34,48,45,.04);}
  h1{font-size:24px; font-weight:650; margin-bottom:6px;}
  h2{font-size:20px; font-weight:650; margin-bottom:4px;}
  .comfort{font-style:italic; color:var(--soft); font-size:15px; margin:2px 0 18px;}
  .q{margin:22px 0 8px; font-weight:600; font-size:17px;}
  .q:first-of-type{margin-top:14px;}
  .hint{color:var(--soft); font-size:14.5px; margin:-2px 0 10px;}
  .opts{display:flex; flex-wrap:wrap; gap:10px; margin:8px 0 4px;}
  .opts.stack{flex-direction:column;}
  button{font:inherit; cursor:pointer;}
  .opt{background:var(--chip); border:1.5px solid var(--line); border-radius:12px;
    padding:13px 16px; font-size:16.5px; text-align:left; color:var(--ink); min-height:48px;}
  .opt:active{transform:scale(.99);}
  .opt.sel{background:var(--accent-soft); border-color:var(--accent); font-weight:600;}
  .opt.sel::before{content:"✓ "; color:var(--accent); font-weight:700;}
  .opt .ex{display:block; font-weight:400; font-size:14px; color:var(--soft); margin-top:2px;}
  .opt.sel .ex{color:var(--soft);}
  .tilegrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:9px; margin:8px 0;}
  .tile{background:var(--chip); border:1.5px solid var(--line); border-radius:10px; padding:12px 10px;
    font-size:15.5px; text-align:center; min-height:48px;}
  .tile.sel{background:var(--accent-soft); border-color:var(--accent); font-weight:600;}
  input[type=text], input[type=tel], input[type=number], textarea{
    font:inherit; width:100%; padding:12px 13px; border:1.5px solid var(--line);
    border-radius:10px; background:#fff; color:var(--ink); margin:4px 0 6px;}
  textarea{min-height:96px; resize:vertical;}
  input:focus, textarea:focus, button:focus-visible{outline:3px solid rgba(34,104,92,.35); outline-offset:1px;}
  input.bad{border-color:#B4552D;}
  .validate{font-size:13.5px; color:#8A4A22; margin:-2px 0 8px;}
  .counter{font-size:13px; color:var(--soft); text-align:right; margin-top:-2px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1.4fr; gap:10px;}
  @media(max-width:520px){.row2{grid-template-columns:1fr;}}
  .nav{display:flex; justify-content:space-between; align-items:center; gap:12px; margin-top:28px;}
  .btn-primary{background:var(--accent); color:var(--accent-ink); border:none; border-radius:12px;
    padding:14px 26px; font-size:17px; font-weight:600; min-height:52px;}
  .btn-primary:disabled{opacity:.45; cursor:not-allowed;}
  .btn-ghost{background:none; border:none; color:var(--soft); font-size:16px; padding:12px 8px; text-decoration:underline;}
  .btn-quiet{background:var(--chip); border:1.5px solid var(--line); border-radius:12px; padding:12px 18px; font-size:16px;}
  .skiplink{background:none; border:none; color:var(--soft); font-size:14.5px; text-decoration:underline; padding:6px 2px; display:inline-block;}
  .skipdone{font-size:14.5px; color:var(--accent); padding:6px 2px; display:inline-block;}
  .skipdone button{background:none;border:none;color:var(--soft);text-decoration:underline;font-size:13.5px;}
  .info-btn{background:var(--chip); border:1px solid var(--line); border-radius:50%; width:26px; height:26px;
    font-size:13px; font-weight:700; color:var(--accent); vertical-align:2px; margin-left:6px; line-height:1;}
  .info-box{background:var(--accent-soft); border-radius:10px; padding:11px 14px; font-size:14.5px;
    color:var(--ink); margin:6px 0 10px; display:none;}
  .info-box.open{display:block;}
  .roster-item{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    background:var(--chip); border:1.5px solid var(--line); border-radius:12px; padding:14px 16px; margin:8px 0;}
  .roster-name{font-weight:600; font-size:17px;}
  .roster-sub{font-size:14px; color:var(--soft);}
  .check{color:var(--good); font-weight:700; font-size:18px;}
  .roster-item.suggest{border-color:var(--accent); background:var(--accent-soft); box-shadow:0 0 0 2px rgba(34,104,92,.18);}
  .suggest-badge{display:block; font-size:13.5px; font-weight:700; color:var(--accent); margin-bottom:3px;}
  .divider{border:none; border-top:1px solid var(--line); margin:22px 0;}
  .notice{background:var(--accent-soft); border-radius:10px; padding:13px 15px; font-size:15px; margin:14px 0;}
  .subtle{font-size:14px; color:var(--soft);}
  .scale{display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 2px;}
  .scale .opt{flex:1 1 100px; text-align:center; padding:12px 8px; font-size:15px;}
  /* review screen */
  .rev-section{border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin:10px 0; background:#fff;}
  .rev-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;}
  .rev-head h3{font-size:15.5px;}
  .rev-section .p-line{margin:3px 0; font-size:14.5px;}
  .rev-section .p-line b{font-weight:600;}
  .rev-section .p-check{margin:2px 0 2px 12px; font-size:14.5px;}
  .rev-section .p-staff{display:none;}
  /* ---------- print ---------- */
  #printRoot{display:none;}
  @media print{
    body{background:#fff; font-size:12px;}
    #app{display:none;}
    #printRoot{display:block; max-width:100%; color:#000;}
    .p-title{font-size:18px; font-weight:700; margin-bottom:2px;}
    .p-meta{font-size:11px; margin-bottom:10px;}
    .p-section{border:1px solid #999; border-radius:6px; padding:10px 12px; margin:0 0 10px; page-break-inside:avoid;}
    .p-section h3{font-size:13.5px; border-bottom:1px solid #bbb; padding-bottom:3px; margin-bottom:6px;}
    .p-person{page-break-before:always; border-top:3px solid #000; padding-top:8px; margin-top:8px;}
    .p-line{margin:2.5px 0;}
    .p-line b{font-weight:600;}
    .p-staff{color:#444; border:1px dashed #999; padding:4px 8px; margin:5px 0; font-size:11.5px;}
    .p-primary{font-weight:700;}
    .p-check{margin:1.5px 0 1.5px 10px;}
    .p-cards{display:flex; flex-wrap:wrap; gap:8px;}
    .p-card{border:1px solid #999; border-radius:6px; padding:6px 8px; width:31%; font-size:10.5px; page-break-inside:avoid;}
    .p-card .p-card-name{font-weight:700; font-size:11.5px; border-bottom:1px solid #bbb; padding-bottom:2px; margin-bottom:3px;}
    .p-card .p-line{margin:1.5px 0;}
    .p-needs{border:2px solid #000; border-radius:6px; padding:10px 12px; margin-top:12px; page-break-inside:avoid;}
    .p-needs h3{font-size:14px; margin-bottom:6px;}
    .p-needs .who{font-weight:700; margin-top:6px;}
    .p-needs h4{font-size:11.5px; text-transform:uppercase; margin:6px 0 1px; letter-spacing:.04em;}
    .p-needs ul{list-style:none; padding-left:8px;}
    .p-needs li{margin:2px 0;}
    .p-needs li::before{content:"\2610  ";}
    .p-needs li.b{font-weight:700;}
    .p-needs .cra-flag{font-weight:700; font-size:12.5px; margin:2px 0 4px; padding-left:8px;}
    .p-mfb{border:2px dashed #000; padding:6px 9px; margin-top:8px; font-size:12.5px; color:#000;}
    .p-roi{border:2px solid #000; border-radius:6px; padding:10px 12px; margin-top:10px; font-weight:700; page-break-inside:avoid;}
    .p-roi h3{font-size:14px; margin-bottom:6px;}
    .p-roi-line{margin:3px 0; font-size:12.5px;}
  }
  /* ---------- persistent Notes widget ---------- */
  .notes-fab{position:fixed; right:16px; bottom:16px; z-index:80; background:var(--accent); color:var(--accent-ink);
    border:none; border-radius:999px; padding:13px 20px; font-size:15.5px; font-weight:600;
    box-shadow:0 2px 10px rgba(0,0,0,.22); cursor:pointer;}
  .notes-panel{position:fixed; right:16px; bottom:76px; z-index:80; width:min(340px, calc(100vw - 32px));
    max-height:min(60vh, 420px); background:#fff; border:1.5px solid var(--line); border-radius:14px;
    box-shadow:0 4px 18px rgba(0,0,0,.22); padding:14px; display:none; flex-direction:column;}
  .notes-panel.open{display:flex;}
  .notes-panel-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;
    font-weight:650; font-size:16.5px;}
  .notes-panel-head button{background:none; border:none; font-size:20px; line-height:1; color:var(--soft);
    cursor:pointer; padding:2px 4px;}
  .notes-panel textarea{flex:1; min-height:150px; width:100%; resize:vertical; font:inherit;
    padding:11px 12px; border:1.5px solid var(--line); border-radius:10px; background:#fff; color:var(--ink);}
  @media print{ .notes-fab, .notes-panel{ display:none !important; } }
</style>
</head>

<div id="app"></div>
<div id="printRoot"></div>

   Stored ANSWERS always stay in English (the CRM print is staff-facing

   translates its two halves. Strings missing from the dictionary fall
   back to English — note any you spot during testing. */
let LANG = "en";
function tr(s){
  if(LANG==="en" || typeof s!=="string") return s;
  const D = I18N[LANG]; if(!D) return s;
  if(D[s]!==undefined) return D[s];
  const trimmed = s.trim();
  if(trimmed && D[trimmed]!==undefined){
    return s.replace(trimmed, D[trimmed]);
  }
  return s;
}
function trn(template, name){ return tr(template).split("{n}").join(name); }

const WORKER_URL = "https://frc-intake-poc.mikewilson129.workers.dev/submit";
const SUBMIT_TOKEN = "WYGZk2kM3o81QczfKbRIIYo2uSthVaVk";
async function submitIntake(payload){
  try{
    const res = await fetch(WORKER_URL, {
      method:"POST",
      headers:{ "Content-Type":"application/json", "X-Submit-Token":SUBMIT_TOKEN },
      body: JSON.stringify(payload)
    });
    const result = await res.json().catch(()=>({}));
    if(!res.ok || !result.ok){
      console.error("Remote submission failed:", result);
      return {success:false, result:result};
    }
    return {success:true, result:result};
  }catch(err){
    console.error("Network error submitting intake:", err);
    return {success:false, error: err.message};
  }
}

function dobValid(m){
  const mo=+m.dobM, d=+m.dobD, y=+m.dobY;
  if(!m.dobM||!m.dobD||!m.dobY) return false;
  if(!(y>=1900 && y<=TODAY.getFullYear())) return false;
  if(!(mo>=1&&mo<=12)) return false;
  const dt = new Date(y, mo-1, d);
  if(dt.getFullYear()!==y || dt.getMonth()!==mo-1 || dt.getDate()!==d) return false;
  if(dt > TODAY) return false;
  return true;
}
function syncDob(m){ m.dob = dobValid(m) ? (m.dobY+"-"+String(m.dobM).padStart(2,"0")+"-"+String(m.dobD).padStart(2,"0")) : ""; }
function ageOf(m){
  if(!m.dob) return null;
  const d = new Date(m.dob+"T00:00:00"); if(isNaN(d)) return null;
  let a = TODAY.getFullYear()-d.getFullYear();
  const md = TODAY.getMonth()-d.getMonth();
  if(md<0 || (md===0 && TODAY.getDate()<d.getDate())) a--;
  return a;
}
function isChild(m){ const a=ageOf(m); return a!==null && a<18; }
function displayName(m){ return (m.preferred||m.first||"This person"); }
function fullName(m){ return (m.first+" "+m.last).trim(); }
function digitsOf(s){ return (s||"").replace(/\D/g,""); }
function phoneValid(){ return digitsOf(state.family.phone).length===10; }
function emailLooksValid(){ const v=(state.family.email||"").trim(); return !v || /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

/* ============ RENDER HELPERS ============ */
const app = document.getElementById("app");
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  if(attrs) for(const k in attrs){
    if(k==="class") n.className = attrs[k];
    else if(k==="html") n.innerHTML = attrs[k];
    else if(k.startsWith("on")) n.addEventListener(k.slice(2), attrs[k]);
    else if(k==="disabled"){ if(attrs[k]) n.disabled = true; }
    else n.setAttribute(k, attrs[k]);
  }
  for(const kid of kids){
    if(kid==null) continue;
    n.appendChild(typeof kid==="string" ? document.createTextNode(tr(kid)) : kid);
  }
  return n;
}
/* info button: ONE handler, always stops propagation (fix for the
   double-handler bug that made option-level info buttons do nothing) */
function infoBtn(text){
  const box = el("div",{class:"info-box"}, text);
  const b = el("button",{class:"info-btn", type:"button", "aria-label":"More information"},"i");
  b.addEventListener("click", (e)=>{ e.stopPropagation(); box.classList.toggle("open"); });
  return {btn:b, box:box};
}
function qLabel(text, info){
  const wrap = el("div");
  const q = el("div",{class:"q"}, text);
  if(info){ const i = infoBtn(info); q.appendChild(i.btn); wrap.appendChild(q); wrap.appendChild(i.box); }
  else wrap.appendChild(q);
  return wrap;
}
function qSingle(opts, get, set, o){
  o = o||{};
  const wrap = el("div",{class:"opts"+(o.stack?" stack":"")});
  for(const raw of opts){
    const item = typeof raw==="string" ? {v:raw} : raw;
    const b = el("button",{class:"opt"+(get()===item.v?" sel":""), type:"button",
      onclick:()=>{ set(get()===item.v && o.toggle!==false ? null : item.v); rerender(); }},
      item.v, item.ex?el("span",{class:"ex"}, item.ex):null);
    if(item.info){ const i=infoBtn(item.info); b.appendChild(i.btn); wrap.appendChild(b); wrap.appendChild(i.box); }
    else wrap.appendChild(b);
  }
  return wrap;
}
/* single-select that collapses to the chosen answer with a change button */
function qSingleCollapse(opts, get, set, o){
  o=o||{};
  const v = get();
  if(v){
    const label = (v==="Did not answer") ? "Skipped — will print as Did Not Answer" : v;
    return el("div",{class:"notice"},"Selected: ", el("b",null,label), " ",
      el("button",{class:"skiplink", type:"button", onclick:()=>{set(null); rerender();}},"change"));
  }
  return qSingle(opts, get, set, o);
}
function qMulti(opts, arrGet, o){
  o=o||{};
  const wrap = el("div",{class:"opts"+(o.stack?" stack":"")});
  for(const raw of opts){
    const item = typeof raw==="string" ? {v:raw} : raw;
    const arr = arrGet();
    const on = arr.includes(item.v);
    const b = el("button",{class:"opt"+(on?" sel":""), type:"button",
      onclick:()=>{ const a=arrGet(); const ix=a.indexOf(item.v);
        if(ix>=0) a.splice(ix,1); else a.push(item.v);
        if(o.onchange) o.onchange(item.v); rerender(); }},
      item.v, item.ex?el("span",{class:"ex"}, item.ex):null);
    if(item.info){ const i=infoBtn(item.info); b.appendChild(i.btn); wrap.appendChild(b); wrap.appendChild(i.box); }
    else wrap.appendChild(b);

function qText(getObj, key, o){
  o=o||{};
  const inp = el("input",{type:o.type||"text", value:getObj[key]||"", placeholder:tr(o.ph||"")});
  if(o.max) inp.maxLength = o.max;
  if(o.bad) inp.classList.add("bad");
  inp.addEventListener("input", ()=>{ getObj[key]=inp.value; if(o.oninput) o.oninput(inp.value, inp); });
  return inp;
}
function qArea(getObj, key, o){
  o=o||{};
  const wrap = el("div");
  const t = el("textarea",{placeholder:tr(o.ph||"")});
  t.value = getObj[key]||"";
  if(o.max) t.maxLength = o.max;
  const c = el("div",{class:"counter"});
  const upd = ()=>{ if(o.max) c.textContent = (t.value.length)+" / "+o.max; };
  t.addEventListener("input", ()=>{ getObj[key]=t.value; upd(); });
  upd();
  wrap.appendChild(t); if(o.max) wrap.appendChild(c);
  return wrap;
}
/* standardized skip: records "Did not answer", shows undo */
function skipRow(get, set){
  if(get()==="Did not answer"){
    return el("div",{class:"skipdone"},"Skipped ",
      el("button",{type:"button", onclick:()=>{set(null); rerender();}},"undo"));
  }
  return el("div", null, el("button",{class:"skiplink", type:"button",
    onclick:()=>{set("Did not answer"); rerender();}},"Skip — leave blank"));
}
/* Yes/No + standardized skip (replaces the old visible DNA button) */
function ynd(get, set){
  const w = el("div");
  w.appendChild(qSingle(["Yes","No"], ()=>get()==="Did not answer"?null:get(), set));
  w.appendChild(skipRow(get, set));
  return w;
}
function scaleRow(get, set){
  const w = el("div");
  w.appendChild(el("div",{class:"scale"}, ...SCALE_OPTS.map(s=>
    el("button",{class:"opt"+(get()===s?" sel":""), type:"button",
      onclick:()=>{set(get()===s?null:s); rerender();}}, s))));
  w.appendChild(skipRow(get, set));
  return w;
}

const history = [];
let current = null;
function goTo(id, ctx){ history.push({id:id, ctx:ctx||{}}); current = history[history.length-1]; render(false); }
function back(){ if(history.length>1){ history.pop(); current = history[history.length-1]; render(false); } }
function rerender(){ render(true); }   /* preserve scroll on in-place updates */
function render(preserveScroll){
  const x = window.scrollX, y = window.scrollY;
  syncNotesI18n();
  app.innerHTML = "";
  /* Language options: [code, native self-label, beta?]. Add new languages here only. */
  const LANG_OPTIONS = [
    ["en","English",false],
    ["es","Espa\u00f1ol",false],
    ["pt","Portugu\u00eas",true],
    ["ht","Krey\u00f2l",true],
  ];
  const langSel = el("select",{id:"langSelect", style:"padding:8px 10px; font-size:15px; border-radius:8px; border:1px solid var(--border,#ccc); background:#fff;",
    onchange:(e)=>{ LANG = e.target.value; rerender(); }});
  for(const [code,label,beta] of LANG_OPTIONS){
    const opt = document.createElement("option");
    opt.value = code; opt.textContent = label + (beta ? " (beta)" : "");
    if(code===LANG) opt.selected = true;
    langSel.appendChild(opt);
  }
  const head = el("div",{style:"display:flex; justify-content:space-between; align-items:center;"},
    el("div",{class:"brand"},"Family Intake"),
    langSel);
  app.appendChild(head);
  const scr = SCREENS[current.id](current.ctx);
  app.appendChild(scr);
  if(preserveScroll) window.scrollTo(x, y);
  else window.scrollTo(0,0);
}
function shell(o){
  const card = el("div",{class:"card"});
  if(o.title) card.appendChild(el("h2",null,o.title));
  if(o.comfort) card.appendChild(el("div",{class:"comfort"},o.comfort));
  for(const b of o.body||[]) if(b) card.appendChild(b);
  const nav = el("div",{class:"nav"});
  nav.appendChild(o.noBack ? el("span") :
    el("button",{class:"btn-ghost", type:"button", onclick:o.onBack||back},"‹ Back"));
  const right = el("div",{style:"display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:flex-end;"});
  if(o.extraNav) right.appendChild(o.extraNav);
  if(o.next){
    right.appendChild(el("button",{class:"btn-primary", type:"button",
      disabled:(o.canNext!==undefined && !o.canNext), onclick:o.next}, o.nextLabel||"Continue"));
  }
  nav.appendChild(right);
  card.appendChild(nav);
  return card;
}

/* ---- Intake step engine (supports edit ranges) ---- */
/* Previous non-auto-skipped step index, or -1 if there is none (i.e. this
   is the first real step). Used so Back works the same regardless of how
   this screen was reached (sequential flow, "Continue intake", or an
   editing "Edit" from Review) instead of depending on the history stack,
   which only reflects steps actually visited this navigation. */
function prevStepIndex(steps, m, i){
  let j = i-1;
  while(j>=0){
    if(steps[j](m).autoSkip){ j--; continue; }
    return j;
  }
  return -1;
}
SCREENS.intake = (ctx) => {
  const m = state.members.find(x=>x.id===ctx.mid);
  const steps = isChild(m) ? childSteps(m) : adultSteps(m);
  let i = Math.min(ctx.step, steps.length-1);
  let s = steps[i](m);
  while(s.autoSkip && i<steps.length-1){ i++; s = steps[i](m); }
  const editing = ctx.editEnd!==undefined;
  if(!editing) m.step = Math.max(m.step, i);
  const last = editing ? i>=ctx.editEnd : i===steps.length-1;
  return shell({
    title: s.title,
    comfort: s.comfort,
    body: s.body,
    canNext: s.canNext!==false,
    onBack: ()=>{
      const j = prevStepIndex(steps, m, i);
      if(j<0) back();
      else {
        /* Mutate the current history entry in place rather than pushing a
           new one — Back should retrace steps, not grow the stack, so that
           eventually stepping back past the first step still lands on
           whatever screen originally led into this intake (review,
           rosterSelect, etc.) instead of on an intake step we visited
           while going backward. */
        current.ctx = editing ? {mid:m.id, step:j, editEnd:ctx.editEnd} : {mid:m.id, step:j};
        render(false);
      }
    },
    next: ()=>{
      let j = i+1;
      while(j<steps.length){
        const probe = steps[j](m);
        if(probe.autoSkip){ j++; continue; }
        break;
      }
      if(editing){
        if(j>ctx.editEnd || j>=steps.length){ goTo("review",{mid:m.id}); }
        else goTo("intake",{mid:m.id, step:j, editEnd:ctx.editEnd});
      }
      else if(j>=steps.length){ m.done=true; m.step=0;
        if(!isChild(m)) state.lastDoneAdultId = m.id;
        goTo("intakeDone",{mid:m.id}); }
      else { m.step=j; goTo("intake",{mid:m.id, step:j}); }
    },
    nextLabel: editing ? (last ? "Done editing" : "Continue") :
      (last ? "Finish this intake" : "Continue"),
    extraNav: editing ? null :
      el("button",{class:"btn-quiet", type:"button", onclick:()=>goTo("rosterSelect")},"Family list")
  });
};

/* helpers shared by intakes */
function normTxt(s){ return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,""); }
function roleTypeahead(m){
  const a=m.a; if(a.roleQ===undefined) a.roleQ="";
  const wrap = el("div");
  const inp = el("input",{type:"text", placeholder:tr("Start typing — like \u201Cmom\u201D, \u201Cgrandma\u201D, \u201Cson\u201D…"), value:a.roleQ});
  const list = el("div",{class:"opts stack", style:"margin-top:8px;"});
  function refresh(){
    list.innerHTML="";
    const q=normTxt((a.roleQ||"").trim());
    let matches=[];
    if(q.length){
      const aliasHits = new Set();
      for(const key in ROLE_ALIASES){ const nk=normTxt(key);
        if(nk.startsWith(q)||q.startsWith(nk)) ROLE_ALIASES[key].forEach(r=>aliasHits.add(r)); }
      const aliasList = ROLE_ALIASES[q] || [...aliasHits];
      /* keep alias order first (most likely picks), then plain text matches */
      const textMatches = ROLES.filter(r=>normTxt(r).includes(q));
      matches = [...new Set([...aliasList.filter(r=>r!=="__DECLINE__"), ...textMatches])];
    }
    const roleDisp = (r)=> r==="Other" ? "Other (role)" : r;
    if(a.role){ list.appendChild(el("div",{class:"notice"},"Selected: ", el("b",null,roleDisp(a.role)), " ",
      el("button",{class:"skiplink", type:"button", onclick:()=>{a.role=null; refresh();}},"change"))); }
    if(!a.role){
      for(const r of matches.slice(0,9)){
        list.appendChild(el("button",{class:"opt", type:"button",
          onclick:()=>{a.role=r; a.roleDecline=false; refresh();}}, roleDisp(r)));
      }
      if(q.length && !matches.length) list.appendChild(el("p",{class:"subtle"},"No matches — try another word, or choose below."));
      list.appendChild(el("button",{class:"opt"+(a.roleDecline?" sel":""), type:"button",
        onclick:()=>{a.roleDecline=!a.roleDecline; a.role=null; refresh();}},"Decline to answer"));
    }
  }
  inp.addEventListener("input",()=>{a.roleQ=inp.value; refresh();});
  wrap.appendChild(inp); wrap.appendChild(list); refresh();
  return wrap;
}
function famStatusBlock(m){
  const a=m.a;
  const child = isChild(m);
  const age = ageOf(m);
  if(!a.famStatus){
    a.famStatus=[];
    if(child){ a.famStatus.push("Youth"); }
    else {
      const mapped = ROLE_TO_STATUS[a.role];
      if(mapped && mapped!=="Youth" && !a.famStatus.includes(mapped)) a.famStatus.push(mapped);
    }
  }
  let opts;
  if(child){
    opts = ["Youth","Youth in Congregate Care","Teen Parent (currently under the age of 19)","N/A","Other"];
  } else {
    opts = FAM_STATUS.filter(v=>{
      if(v==="Youth"||v==="Youth in Congregate Care") return false;
      if(v==="Teen Parent (currently under the age of 19)" && age!==null && age>=19) return false;
      return true;
    });
  }
  return qMulti(opts.map(v=>FAM_STATUS_INFO[v]?{v:v, info:FAM_STATUS_INFO[v]}:{v:v}), ()=>a.famStatus, {stack:false});
}

/* Ethnicity asked FIRST; a "Yes, ..." Hispanic answer auto-checks
   Hispanic/Latino in the race list (still uncheckable). Print order
   in the CRM sections stays Race-then-Ethnicity. */
function ethRaceBlock(m){
  const a = m.a;
  if(!a.race) a.race=[]; if(!a.ethnicity) a.ethnicity=[];
  const syncHisp = ()=>{
    const yes = a.ethnicity.some(v=>v.startsWith("Yes,"));
    if(yes && !a.race.includes("Hispanic/Latino") && !a.hispUnchecked){
      a.race.push("Hispanic/Latino"); a.hispAuto = true;
    }
    if(!yes && a.hispAuto){
      const ix = a.race.indexOf("Hispanic/Latino");
      if(ix>=0) a.race.splice(ix,1);
      a.hispAuto = false;
    }
  };
  syncHisp();
  return [
    qLabel("Ethnicity (check all that apply)"),
    qMulti(["No, Not Hispanic","Yes, Mexican, Mexican American, Chicano","Yes, Puerto Rican","Yes, Cuban",
      "Yes, Brazilian","Yes, another Hispanic, Latino, or Spanish Origin"],
      ()=>a.ethnicity, {stack:true, onchange:()=>{ a.hispUnchecked=false; syncHisp(); }}),
    (a.ethnicity.includes("Yes, another Hispanic, Latino, or Spanish Origin")? el("div",null,
      el("p",{class:"hint"},"Which origin? Type whatever you'd like."),
      qText(a,"hispanicOrigin",{ph:"e.g., Dominican, Colombian, Guatemalan…"})):null),
    qMulti(["Other","Choose Not to Answer"],
      ()=>a.ethnicity, {stack:true, onchange:()=>{ a.hispUnchecked=false; syncHisp(); }}),
    (a.ethnicity.includes("Other")? qText(a,"ethnicityOther",{ph:"Ethnicity — in your own words"}):null),
    qLabel("Any other races you identify as? (check all that apply)"),
    qMulti(["White","Black/African American","American Indian","Asian Indian","Japanese","Native Hawaiian",
      "Chinese","Korean","Guamanian","Filipino","Vietnamese","Samoan","Hispanic/Latino","Other","Choose Not to Answer"],
      ()=>a.race, {onchange:(v)=>{ if(v==="Hispanic/Latino"){ a.hispAuto=false; a.hispUnchecked=!a.race.includes("Hispanic/Latino"); } }}),
    (a.race.includes("Other")? qText(a,"raceOther",{ph:"Race — in your own words"}):null)
  ];
}
function reasonBlock(m){
  const a=m.a; if(!a.reasonPicks) a.reasonPicks=[];
  const child = isChild(m);
  const age = ageOf(m);
  const adultPicks = [...REASON_PICKS_ADULT, "CRA Support"];
  const childPicks = (age!==null && age>=11) ? [...REASON_PICKS_CHILD, "CRA Support"] : REASON_PICKS_CHILD;
  return [
    qLabel(child ? trn("What brings you in for {n} today?", displayName(m)) : "What brings you in today?"),
    el("p",{class:"hint"},"Tap anything that fits — then add anything else in your own words. A few words is plenty, no story needed."),
    qMulti(child ? childPicks : adultPicks, ()=>a.reasonPicks),
    qLabel("Anything else, in your own words"),
    qArea(a,"reasonText",{ph:"e.g., housing, help with my son's school, feeling overwhelmed…", max:300})
  ];
}

/* ============ ADULT INTAKE STEPS ============ */
function adultSteps(m){
  const a = m.a;
  return [
  /* 0 */
  (m)=>({ title:"About your family role",
    comfort:comfort("These are just for information."),
    body:[ qLabel("What's your role in the family?","For example: mother, foster parent, grandmother raising a grandchild. Type a word and pick the best fit."),
      roleTypeahead(m) ],
    canNext:true }),
  /* 1 */
  (m)=>({ title:"A little about you",
    comfort:comfort("This helps us understand who we serve."),
    body: ethRaceBlock(m),
    canNext:true }),
  /* 2 */
  (m)=>({ title:"Language & service",
    comfort:comfort("There are no wrong answers here."),
    body:[
      langBlock(a, "What language do you mainly speak at home?"),

      ynd(()=>a.military, v=>a.military=v),

          el("div",null, el("p",{class:"hint"},"Month"), qText(a,"deployM",{ph:"MM", max:2})),
          el("div",null, el("p",{class:"hint"},"Year"), qText(a,"deployY",{ph:"YYYY", max:4})))) : null)
    ], canNext:true }),
  /* 3 */
  (m)=>({ title:"Family & relationship status",
    comfort:comfort("Check anything that's true for you — more than one is fine."),
    body:[
      qLabel("Which of these describe you?","For example, a grandparent raising a grandchild through foster care might check several of these."),
      famStatusBlock(m),
      qLabel("Marital status"),
      qSingle(MARITAL_OPTS, ()=>a.marital, v=>a.marital=v),
      skipRow(()=>a.marital, v=>a.marital=v)
    ], canNext:true }),
  /* 4 */
  (m)=>({ title:"What brings you in",
    comfort:comfort("A few words is plenty — a staff member can help you sort it out."),

  /* 5 */
  (m)=>{ if(!a.employment)a.employment=[];
    return { title:"School & work",
    comfort:comfort("Just for information — nothing here affects services."),
    body:[
      qLabel("Highest level of education completed"),
      qSingleCollapse(EDU_OPTS, ()=>a.edu, v=>a.edu=v, {stack:true}),
      (!a.edu ? skipRow(()=>a.edu, v=>a.edu=v) : null),
      qLabel("Employment status (check all that apply)"),
      qMulti(EMPLOY_OPTS, ()=>a.employment, {stack:true})
    ], canNext:true };},
  /* 6 */
  (m)=>{ if(!a.incomeSrc)a.incomeSrc=[];
    return { title:"Sources of income",
    comfort:comfort("Check anything that applies."),
    body:[
      qLabel("Where does your household income come from? (check all that apply)"),
      qMulti(INCOME_SRC_OPTS, ()=>a.incomeSrc, {stack:true})
    ], canNext:true };},
  /* 7 */
  (m)=>{ if(!a.disabTypes)a.disabTypes=[];
    return { title:"Your health",
    comfort:comfort("This is just for information — it doesn't affect any services or benefits."),
    body:[
      qLabel("Do you have a disability?","This is based on how you see yourself — it won't affect any benefits you're eligible for, and it can be any kind of disability (physical, learning, mental health, and so on)."),
      ynd(()=>a.disability, v=>a.disability=v),
      (a.disability==="Yes" ? el("div",null,
        qLabel("What kind? (check all that apply)"),
        qMulti(DISAB_ADULT, ()=>a.disabTypes)) : null),
      qLabel("Overall, how is your physical and mental health?", HEALTH_INFO),
      qSingle(HEALTH_OPTS, ()=>a.overallHealth, v=>a.overallHealth=v),
      skipRow(()=>a.overallHealth, v=>a.overallHealth=v),
      qLabel("Do you have any ongoing health conditions that need regular check-ins or care?", COND_INFO),
      ynd(()=>a.condFlag, v=>a.condFlag=v),
      (a.condFlag==="Yes" ? conditionsBlock(a) : null)
    ], canNext:true };},
  /* 8 */
  (m)=>({ title:"Doctor & dentist",
    comfort:comfort("Almost through this part."),
    body:[
      qLabel("Have you seen a doctor or nurse practitioner in the last 12 months?"),
      ynd(()=>a.doctor12, v=>a.doctor12=v),
      qLabel("Have you seen a dentist in the last 12 months?"),
      ynd(()=>a.dentist12, v=>a.dentist12=v)
    ], canNext:true }),
  /* 9 */
  (m)=>({ title:"Feeling safe",
    comfort:comfort("Nothing here changes what help you can get."),
    body:[
      qLabel("I feel safe in my home"), scaleRow(()=>a.safeHome, v=>a.safeHome=v),

      qLabel("I feel safe on the streets in my neighborhood"), scaleRow(()=>a.safeStreets, v=>a.safeStreets=v)
    ], canNext:true }),
  /* 10 */
  (m)=>({ title:"A few more",
    comfort:comfort("Almost done."),

      qLabel("At any point in your life, have you witnessed violence?","\u201CWitness\u201D means whatever it means to you — there's no wrong answer, and you don't need to share details."),
      ynd(()=>a.witnessed, v=>a.witnessed=v),
      qLabel("Are you personally involved in any court matters?","This is about you — not your child."),
      ynd(()=>a.court, v=>a.court=v),

  (m)=>{

    if(clothAuto) a.s4clothing="Yes";
    if(foodAuto && clothAuto) return {autoSkip:true, title:"", body:[]};
    return { title:"Day-to-day needs",

    body:[

      qMulti(AGENCIES, ()=>a.agencies, {stack:true}),
      communityBlock(a)

  /* 13 */
  (m)=>{ if(!a.civic)a.civic=[];
    return { title:"Community life",
    comfort:comfort("Totally optional — it just helps us learn what families enjoy."),
    body:[
      qLabel("Are you involved with any of the following?"),
      qMulti(CIVIC_ADULT, ()=>a.civic, {stack:true})
    ], canNext:true };}
  ];
}

/* ============ CHILD INTAKE STEPS ============ */
function parentReasonPicks(){
  const self = state.members.find(x=>x.isSelf);
  return (self && self.a && self.a.reasonPicks) ? self.a.reasonPicks : [];
}
function parentWantsFood(){
  const self = state.members.find(x=>x.isSelf);
  return !!(self && self.a && self.a.s4food==="Yes");
}
function parentWantsClothing(){
  const self = state.members.find(x=>x.isSelf);
  return !!(self && self.a && self.a.s4clothing==="Yes");
}
function notSchoolAged(a){ return a.eduStatus==="Not school aged"; }
function childSteps(m){
  const a = m.a;
  const kid = ()=>displayName(m);
  const age = ()=>ageOf(m);
  return [
  /* 0: CRA — only for ages 12+ */
  (m)=>{
    const ag = age();
    if(ag!==null && ag<12){ a.craActive="No"; a.craUnder12=true; return {autoSkip:true, title:"", body:[]}; }
    a.craUnder12=false;
    return { title:trn("Court status for {n}", kid()),
    comfort:"If you're not sure, a staff member can help.",
    body:[
      qLabel("Is there an active CRA for this child?","CRA stands for Child Requiring Assistance — a type of juvenile court case, sometimes filed by a parent or a school."),
      qSingle(["Yes","No"], ()=>a.craActive, v=>a.craActive=v, {toggle:false}),
      (a.craActive==="Yes" ? el("div",null,
        qLabel("Who filed the CRA application?"),
        qSingle(CRA_FILED_BY, ()=>a.craFiledBy, v=>a.craFiledBy=v),
        (a.craFiledBy==="Other" ? qText(a,"craFiledByOther",{ph:"Who filed it?"}) : null)) : null)
    ], canNext: !!a.craActive };},
  /* 1: role */
  (m)=>({ title:trn("{n}'s role in the family", kid()),
    comfort:comfort("These are just for information."),
    body:[ qLabel(trn("What is {n}'s role in the family?", kid()), "For example: son, daughter, grandchild, foster child. Type a word and pick the best fit."),
      roleTypeahead(m) ],
    canNext:true }),
  /* 2: race/ethnicity */
  (m)=>({ title:trn("A little about {n}", kid()),
    comfort:comfort("This helps us understand who we serve."),
    body: ethRaceBlock(m),
    canNext:true }),
  /* 3: language + family status */
  (m)=>({ title:"Language & family",
    comfort:comfort("There are no wrong answers here."),
    body:[
      langBlock(a, trn("What language does {n} mainly speak at home?", kid())),
      qLabel(trn("Which of these describe {n}?", kid())),
      famStatusBlock(m)
    ], canNext:true }),
  /* 4: reason for visit */
  (m)=>({ title:trn("What brings {n} in", kid()),
    comfort:comfort("A few words is plenty — a staff member can help you sort it out."),
    body: reasonBlock(m),
    canNext:true }),
  /* 5: school part 1 */
  (m)=>({ title:trn("{n} & school", kid()),
    comfort:comfort("Just for information — nothing here affects services."),
    body:[
      qLabel("Educational status"),
      qSingleCollapse(EDU_STATUS_CHILD, ()=>a.eduStatus, v=>a.eduStatus=v, {stack:true}),
      (!a.eduStatus ? skipRow(()=>a.eduStatus, v=>a.eduStatus=v) : null),
      (!notSchoolAged(a) ? el("div",null,
        qLabel("School name (or last school attended)"),
        qText(a,"schoolName",{ph:"School name"}),
        qLabel("After-school program (if enrolled)"),
        qText(a,"afterSchool",{ph:"Program name — okay to leave blank"}),
        qLabel("If a school referred you to us, who was it?"),
        qText(a,"schoolPersonnel",{ph:"Name — okay to leave blank"})) : null)
    ], canNext:true }),
  /* 6: school part 2 */
  (m)=>{
    const nsa = notSchoolAged(a);
    const ag = age();
    const showJob = !nsa && ag!==null && ag>=12;
    if(!showJob) a.hasJob = a.hasJob || "No";
    /* IEP -> 504 dependency */
    const iepYes = a.iep==="Yes";
    if(iepYes && !a.plan504Auto){ a.plan504="No"; a.plan504Auto=true; }
    if(!iepYes && a.plan504Auto){ a.plan504=null; a.plan504Auto=false; }
    return { title:trn("{n} & school", kid()),
    comfort:comfort("Answer what you can."),
    body:[
      (!nsa ? el("div",null,
        qLabel(trn("What grade is {n} in?", kid())),
        (a.gradeCur ?
          el("div",{class:"notice"},"Selected: ", el("b",null,a.gradeCur), " ",
            el("button",{class:"skiplink", type:"button", onclick:()=>{a.gradeCur=null; rerender();}},"change")) :
          el("div",{class:"tilegrid"}, ...GRADES.map(g=>
            el("button",{class:"tile", type:"button",
              onclick:()=>{a.gradeCur=g; rerender();}}, g)))),
        qLabel(trn("How is {n} doing in school?", kid())),
        qArea(a,"doingInSchool",{ph:"A sentence or two is plenty", max:200})) : null),
      qLabel(trn("Is {n} on an Individualized Education Plan or Special Education Plan?", kid()), "An IEP is a written school plan for a child who receives special education services. A child can also have an IEP before school age (for example, through preschool special education)."),
      ynd(()=>a.iep, v=>{ a.iep=v; }),
      (a.iep!=="Yes" ? el("div",null,
        qLabel(trn("Is {n} on a 504 Plan?", kid()), "A 504 plan gives a child supports or accommodations at school without full special education. A child can't have both an IEP and a 504."),
        ynd(()=>a.plan504, v=>{a.plan504=v; a.plan504Auto=false;})) : 
        el("p",{class:"subtle"}, trn("Since {n} has an IEP, the 504 question is answered automatically (a child can't have both).", kid()))),
      (!nsa ? el("div",null,
        qLabel(trn("Has {n} missed more than 8 days in the last 10 school weeks?", kid()),"Just an estimate is fine — and it counts missed school for any reason (suspension, illness, avoidance, and so on)."),
        ynd(()=>a.missed, v=>a.missed=v),
        (a.missed==="Yes" ? el("div",null, qLabel("About how many days?"), qText(a,"missedCount",{ph:"e.g., 12"})) : null)) : null),
      (showJob ? el("div",null,
        qLabel(trn("Does {n} have a job?", kid())),
        ynd(()=>a.hasJob, v=>a.hasJob=v),
        (a.hasJob==="No" ? el("div",null,
          qLabel(trn("Is {n} interested in finding a job?", kid())),
          ynd(()=>a.jobInterest, v=>a.jobInterest=v)) : null)) : null)
    ], canNext:true };},
  /* 7: health part 1 */
  (m)=>{ if(!a.disabTypes)a.disabTypes=[];
    return { title:trn("{n}'s health", kid()),
    comfort:comfort("This is just for information — it doesn't affect any services or benefits."),
    body:[
      qLabel(trn("Does {n} have a disability?", kid()),"This is based on how you see it — it won't affect any benefits, and it can be any kind of disability."),
      ynd(()=>a.disability, v=>a.disability=v),
      (a.disability==="Yes" ? el("div",null,
        qLabel("What kind? (check all that apply)"),
        qMulti(DISAB_CHILD, ()=>a.disabTypes)) : null),
      qLabel(trn("Overall, how is {n}'s physical and mental health?", kid()), HEALTH_INFO),
      qSingle(HEALTH_OPTS, ()=>a.overallHealth, v=>a.overallHealth=v),
      skipRow(()=>a.overallHealth, v=>a.overallHealth=v),
      qLabel(trn("Does {n} have any ongoing health conditions that need regular check-ins or care?", kid()), COND_INFO),
      ynd(()=>a.condFlag, v=>a.condFlag=v),
      (a.condFlag==="Yes" ? conditionsBlock(a) : null)
    ], canNext:true };},
  /* 8: health part 2 */
  (m)=>({ title:trn("{n}'s health", kid()),
    comfort:comfort("Answer however you're comfortable — none of this changes what help is available."),
    body:[
      qLabel(trn("Has {n} seen a doctor or nurse practitioner in the last 12 months?", kid())),
      ynd(()=>a.doctor12, v=>a.doctor12=v),
      qLabel(trn("Has {n} seen a dentist in the last 12 months?", kid())),
      ynd(()=>a.dentist12, v=>a.dentist12=v),
      ...((age()!==null && age()<11) ? [] : [
        qLabel(trn("Do you have any concerns about alcohol or drug use for {n}?", kid())),
        ynd(()=>a.substance, v=>a.substance=v)
      ]),
      qLabel(trn("Has {n} ever used mobile crisis teams?", kid()),"The team that comes out when someone is having a mental health crisis."),
      ynd(()=>a.mobileCrisis, v=>a.mobileCrisis=v),
      qLabel(trn("Has {n} ever been hospitalized for mental health reasons?", kid())),
      ynd(()=>a.hospMH, v=>a.hospMH=v),
      qLabel(trn("Does {n} have difficulty following rules?", kid())),
      ynd(()=>a.rules, v=>a.rules=v)
    ], canNext:true }),
  /* 9: safety gate */
  (m)=>{
    const ag = age();
    if(ag!==null && ag<11){
      a.childPresent="No"; a.childPresentAuto=true;
      a.safeHome="Did not answer"; a.safeSchool="Did not answer"; a.safeStreets="Did not answer";
      a.witnessed="Did not answer"; a.exploited="Did not answer"; a.gang="Did not answer";
      return {autoSkip:true, title:"", body:[]};
    }
    a.childPresentAuto=false;
    return { title:trn("A few questions for {n}", kid()),
    comfort:"It's okay if they're not here or would rather not.",
    body:[
      qLabel(trn("Is {n} present and able to answer a few questions directly?", kid())),
      qSingle(["Yes","No"], ()=>a.childPresent, v=>{
        a.childPresent=v;
        if(v==="No"){ a.safeHome="Did not answer"; a.safeSchool="Did not answer"; a.safeStreets="Did not answer";
          a.witnessed="Did not answer"; a.exploited="Did not answer"; a.gang="Did not answer"; }
        else { if(a.safeHome==="Did not answer")a.safeHome=null; if(a.safeSchool==="Did not answer")a.safeSchool=null;
          if(a.safeStreets==="Did not answer")a.safeStreets=null; if(a.witnessed==="Did not answer")a.witnessed=null;
          if(a.exploited==="Did not answer")a.exploited=null; if(a.gang==="Did not answer")a.gang=null; }
      }, {toggle:false})
    ], canNext: !!a.childPresent };},
  /* 10: child-answered safety */
  (m)=>{
    if(a.childPresent!=="Yes") return {autoSkip:true, title:"", body:[]};
    return { title:trn("Feeling safe — for {n}", kid()),
    comfort:comfort("There are no wrong answers."),
    body:[
      qLabel("I feel safe in my home"), scaleRow(()=>a.safeHome, v=>a.safeHome=v),
      qLabel("I feel safe at my school"), scaleRow(()=>a.safeSchool, v=>a.safeSchool=v),
      qLabel("I feel safe on the streets in my neighborhood"), scaleRow(()=>a.safeStreets, v=>a.safeStreets=v),
      qLabel("At any point, have you witnessed violence?","\u201CWitness\u201D means whatever it means to you — no wrong answer, and you don't need to share what it was."),
      ynd(()=>a.witnessed, v=>a.witnessed=v),
      qLabel("Have you ever been in a situation where you were being used or taken advantage of (exploited)?","This means being taken advantage of, or made to do something physically or sexually against your will. This is kept confidential."),
      ynd(()=>a.exploited, v=>a.exploited=v),
      qLabel("Are you involved with a gang?","This is kept confidential — we're only asking so we can offer the right support."),
      ynd(()=>a.gang, v=>a.gang=v)
    ], canNext:true };},
  /* 11: factual safety */
  (m)=>({ title:trn("Court & safety history for {n}", kid()),
    comfort:comfort("Answer however you're comfortable."),
    body:[
      qLabel(trn("Is {n} involved in court?", kid()), "For Care and Protection, CRA, criminal charges, etc."),
      ynd(()=>a.court, v=>a.court=v),
      (a.court==="Yes" ? el("div",null, qLabel("Which court?"), qText(a,"courtWhich",{ph:"e.g., Essex Juvenile Salem"})) : null),
      qLabel(trn("Has {n} ever been detained by the police or arrested?", kid())),
      ynd(()=>a.detained, v=>a.detained=v),
      (a.detained==="Yes" ? el("div",null,
        qLabel("Detained for what reason?"),
        qSingle(DETAINED_REASONS, ()=>a.detainedReason, v=>a.detainedReason=v, {stack:true})) : null),
      qLabel(trn("Has {n} ever run away?", kid())),
      ynd(()=>a.ranAway, v=>a.ranAway=v),
      (a.ranAway==="Yes" ? el("div",null,
        qLabel("How many times?"), qText(a,"ranTimes",{ph:"e.g., 3"}),
        qLabel("When was the last time?"), qText(a,"ranWhen",{ph:"e.g., last month"}),
        qLabel("For how long?"), qText(a,"ranHowLong",{ph:"e.g., overnight"})) : null)
    ], canNext:true }),
  /* 12: S4 living + needs */
  (m)=>{
    const picks = new Set([...(a.reasonPicks||[]), ...parentReasonPicks()]);
    const foodAuto = picks.has("Food resources") || parentWantsFood();
    const clothAuto = picks.has("Clothing resources") || parentWantsClothing();
    if(foodAuto) a.s4food="Yes";
    if(clothAuto) a.s4clothing="Yes";
    return { title:trn("Where {n} lives", kid()),
      comfort:comfort("This just helps us point you to the right resources."),
      body:[
        qLabel(trn("Is {n} currently living with their family?", kid())),
        qSingle(["Yes","No"], ()=>a.livingWithFamily, v=>a.livingWithFamily=v, {toggle:false}),
        (a.livingWithFamily==="No" ? el("div",null,
          qLabel(trn("Who is {n} living with?", kid())),
          qText(a,"livingWith",{ph:"e.g., grandmother, DCF residential placement"})) : null),
        (!foodAuto ? el("div",null, qLabel(trn("Would you like help finding food resources for {n}?", kid())), ynd(()=>a.s4food, v=>a.s4food=v)) : null),
        (!clothAuto ? el("div",null, qLabel(trn("Would you like help finding clothing resources for {n}?", kid())), ynd(()=>a.s4clothing, v=>a.s4clothing=v)) : null)
      ], canNext: !!a.livingWithFamily };},
  /* 13: agencies */
  (m)=>{ if(!a.agencies)a.agencies=[];
    return { title:trn("Agencies {n} works with", kid()),
    comfort:comfort("This helps us avoid duplicating supports already in place."),
    body:[
      qLabel(trn("Is {n} involved with any of the following agencies? (check all that apply)", kid())),
      qMulti(AGENCIES, ()=>a.agencies, {stack:true}),
      (a.court==="Yes" ? el("div",{class:"notice"}, trn("Court involvement: already noted ({n}) — no need to repeat it here.", a.courtWhich||tr("court name not given"))) : null),
      communityBlock(a)
    ], canNext:true };},
  /* 14: civic */
  (m)=>{ if(!a.civic)a.civic=[];
    return { title:trn("{n}'s activities", kid()),
    comfort:comfort("Totally optional — it just helps us learn what kids enjoy."),
    body:[
      qLabel(trn("Is {n} involved with any of the following?", kid())),
      qMulti(CIVIC_CHILD, ()=>a.civic, {stack:true})
    ], canNext:true };}
  ];
}

/* ============ PERSON SECTIONS (shared by review + print) ============ */
let PS_TR = false; /* when true (review screen), labels+values render via tr() */
function pT(s){ return PS_TR ? tr(s) : s; }
function pLine(label, val){
  if(val==null||val===""||val==="Did not answer") val="Did Not Answer";
  if(typeof val==="string") val = pT(val);
  return '<div class="p-line"><b>'+esc(pT(label))+':</b> '+esc(val)+'</div>'; }
function pFree(label, val){ return '<div class="p-line"><b>'+esc(pT(label))+':</b> '+esc(val==null||val===""?"—":val)+'</div>'; }
function pChecks(label, arr){
  let h = '<div class="p-line"><b>'+esc(pT(label))+':</b>'+((arr&&arr.length)?'':(PS_TR?' '+tr("None selected"):' None selected'))+'</div>';
  if(arr) for(const v of arr) h += '<div class="p-check">☑ '+esc(typeof v==="string"?pT(v):v)+'</div>';
  return h;
}
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function genderOut(m){ return m.gender==="Tell Us in Your Own Words" ? (m.genderOther||"Own words (blank)") : (m.gender||"Did Not Answer"); }
function pronounOut(m){ return m.pronouns==="Tell Us in Your Own Words" ? (m.pronounsOther||"Own words (blank)") : (m.pronouns||"Did Not Answer"); }
function dobOut(m){ if(!m.dob) return "Did Not Answer";
  const p=m.dob.split("-"); return p.length===3 ? (+p[1])+"/"+(+p[2])+"/"+p[0] : m.dob; }
function listOut(arr, otherText){
  if(!arr||!arr.length) return null;
  return arr.map(v=> (v==="Other"&&otherText) ? "Other ("+otherText+")" : v);
}
function ethOut(a){
  if(!a.ethnicity||!a.ethnicity.length) return null;
  return a.ethnicity.map(v=>{
    if(v==="Other"&&a.ethnicityOther) return "Other ("+a.ethnicityOther+")";
    if(v==="Yes, another Hispanic, Latino, or Spanish Origin" && a.hispanicOrigin)
      return v+" — "+a.hispanicOrigin;
    return v;
  });
}

/* returns [{title, inner, range:[start,end] | "basics"}] */
function personSections(m, printOrder){
  const child = isChild(m), a = m.a||{};
  const S = [];
  let fmi = pLine("Full name", fullName(m)) +
    pFree("Preferred name", m.preferred) +
    pLine("Gender", genderOut(m)) +
    pLine("Preferred Pronouns", pronounOut(m)) +
    pLine("Health insurance", m.insurance) +
    pLine("First Name", m.first) +
    pLine("Birthdate", dobOut(m)) +
    pLine("Services Needed", m.services ? "Yes" : "No");
  if(m.services) fmi += pLine("Initial Contact Date", TODAY_STR);
  S.push({title:"Family Member Info", inner:fmi, range:"basics"});
  if(!m.services) return S;

  let demo = pLine("What's Your Role in the Family", a.roleDecline ? "Decline to answer" : a.role) +
    pChecks("Race (check all that apply)", listOut(a.race, a.raceOther)) +
    pChecks("Ethnicity (check all that apply)", ethOut(a)) +
    pLine("Primary Language", a.language==="Other" ? ("Other ("+(a.languageOther||"?")+")") : a.language);
  if(!child){
    demo += pLine("Military Service", a.military);
    if(a.military==="Yes"){
      demo += pLine("Service Type", a.militaryType);
      demo += pFree("Last Deployment", (a.deployM&&a.deployY)?(a.deployM+"/"+a.deployY):"");
    }
  }
  S.push({title:"Family Member Info — Demographics", inner:demo, range:child?[1,3]:[0,2]});

  S.push({title:"Family Status", range:child?[3,3]:[3,3], inner:
    pChecks("Family Status (check all that apply)", a.famStatus) +
    pLine("Marital Status", child ? "N/A" : a.marital)});

  if(child){
    S.push({title:"S2 — CRA Related Questions", range:[0,0], inner:
      pLine("CRA Indicator Last Set On", TODAY_STR) +
      pLine("CRA Related Question", a.craActive==="Yes" ? "A CRA Application has been filed for this child" : "No active CRA") +
      pLine("Application was filed by", a.craActive==="Yes" ?
        (a.craFiledBy==="Other" ? "Other ("+(a.craFiledByOther||"?")+")" : (a.craFiledBy||"Did Not Answer")) : "Not Applicable") +
      (a.craUnder12 ? '<div class="p-staff">Under 12 — CRA question not asked; recorded as no active CRA.</div>' : '') +
      '<div class="p-staff">Staff: CRA clinical status (at-risk, etc.) is set separately by the clinician.</div>'});
  }

  S.push({title:"S3 — Reason for Visit", range:[4,4], inner:
    pChecks("Quick picks (client's selections)", a.reasonPicks) +
    pFree("In the client's own words", a.reasonText) +
    '<div class="p-staff">Staff — CRM Reason-for-Visit category(ies): ______________________________________________</div>'});

  if(!child){
    S.push({title:"S1 — Education/Employment", range:[5,6], inner:
      pLine("Highest Level of Education Completed", a.edu) +
      pChecks("Employment Status (check all that apply)", a.employment) +
      pChecks("Source of Income (check all that apply)", a.incomeSrc)});
    let s2 = pLine("Do you have a disability?", a.disability);
    if(a.disability==="Yes") s2 += pChecks("Disability types (check all that apply)", a.disabTypes);
    s2 += pLine("What is your overall physical and mental health?", a.overallHealth) +
      pLine("Do you have any condition(s) that requires regular care or follow-up?", a.condFlag);
    if(a.condFlag==="Yes"){ const c=(a.conditions||[]).filter(x=>x&&x.trim());
      s2 += pFree("Conditions", c.length?c.join("; "):"(none listed)"); }
    s2 += pLine("Have you seen a doctor or nurse practitioner in the last 12 months?", a.doctor12) +
      pLine("Have you seen a dentist in the last 12 months?", a.dentist12);
    S.push({title:"S2 — Physical and Mental Health", range:[7,8], inner:s2});
    let s3 = pLine("Do you feel safe in your home?", a.safeHome) +
      pLine("Do you feel safe at work or school?", a.safeWork) +
      pLine("Do you feel safe on the streets in your neighborhood?", a.safeStreets) +
      pLine("Have you witnessed violence?", a.witnessed) +
      pLine("Are you involved in the court?", a.court);
    if(a.court==="Yes") s3 += pFree("Which Court?", a.courtWhich) + pFree("What reason?", a.courtReason);
    s3 += pLine("Would you like a domestic violence referral?", a.dvReferral);
    S.push({title:"S3 — Safety", range:[9,10], inner:s3});
    S.push({title:"S4 — Basic Needs", range:[11,11], inner:
      pLine("Food", a.s4food) + pLine("Clothing", a.s4clothing)});
    let s5 = pChecks("Agencies (check all that apply)", a.agencies);
    const comm=(a.community||[]).filter(x=>x&&x.trim());
    s5 += pLine("Other community agencies / city-town resources?", a.communityFlag) +
      pFree("Listed", comm.length?comm.join("; "):"—");
    S.push({title:"S5 — Agency Involvement", range:[12,12], inner:s5});
    S.push({title:"S6 — Civic Engagement", range:[13,13], inner:
      pChecks("Involved with (check all that apply)", a.civic)});
  } else {
    const nsa = notSchoolAged(a);
    let s1 = pLine("Educational Status", nsa ? "Other (Not school aged)" : a.eduStatus) +
      pFree("School name/Last School Attended", nsa?"N/A":a.schoolName) +
      pFree("After-School Program (if enrolled)", nsa?"N/A":a.afterSchool) +
      pFree("If referred by School, name of personnel", nsa?"N/A":a.schoolPersonnel) +
      pLine("1. Highest grade completed", nsa ? "N/A (not school aged)" :
        (a.gradeCur ? gradeCompleted(a.gradeCur)+" (currently in "+a.gradeCur+")" : null)) +
      pFree("2. How is this child/youth doing in school?", nsa?"N/A":a.doingInSchool) +
      pLine("3. On an IEP or Special Education Plan?", a.iep) +
      pLine("4. On a 504 Plan?", a.plan504) +
      (a.plan504Auto ? '<div class="p-staff">504 auto-set to No because IEP = Yes (can\u2019t have both).</div>' : '') +
      pLine("5. Missed more than 8 days in the last 10 school weeks?", nsa?"N/A":a.missed);
    if(!nsa && a.missed==="Yes") s1 += pFree("If yes, about how many days?", a.missedCount);
    s1 += pLine("6. Does this child/youth have a job?", a.hasJob||"No");
    const ag=ageOf(m);
    if(ag!==null && ag<12) s1 += '<div class="p-staff">Job question auto-set to No (under 12).</div>';
    S.push({title:"S1 — Education/Employment", range:[5,6], inner:s1});
    let s2 = pLine("Does this child/youth have a disability?", a.disability);
    if(a.disability==="Yes") s2 += pChecks("Disability types (check all that apply)", a.disabTypes);
    s2 += pLine("Overall physical and mental health of this child/youth", a.overallHealth) +
      pLine("Any condition(s) that requires regular care or follow-up?", a.condFlag);
    if(a.condFlag==="Yes"){ const c=(a.conditions||[]).filter(x=>x&&x.trim());
      s2 += pFree("Conditions", c.length?c.join("; "):"(none listed)"); }
    s2 += pLine("Seen a doctor or nurse practitioner in the last 12 months?", a.doctor12) +
      pLine("Seen a dentist in the last 12 months?", a.dentist12) +
      (ag!==null && ag<11
        ? '<div class="p-staff">Alcohol/drug question skipped (under 11).</div>'
        : pLine("Concerns about alcohol or drug use for this child/youth?", a.substance)) +
      pLine("Has this child ever used mobile crisis teams?", a.mobileCrisis) +
      pLine("Ever been hospitalized for mental health reasons?", a.hospMH) +
      pLine("Difficulty following rules?", a.rules);
    S.push({title:"S2 — Physical and Mental Health", range:[7,8], inner:s2});
    let s3 = pLine("Child present to answer directly?", a.childPresent) +
      (a.childPresentAuto ? '<div class="p-staff">Auto-set to No (under 11).</div>' : '') +
      pLine("This child/youth feels safe in his/her home", a.safeHome) +
      pLine("This child/youth feels safe in his/her school", a.safeSchool) +
      pLine("This child/youth feels safe on the streets in his/her neighborhood", a.safeStreets);
    /* Violence/Court/Detained/Ran away/Exploited/Gang: on-screen order stays as-is
       (Violence, Exploited, Gang, then Court/Detained/Ran away). Print output uses
       a different order (Violence, Court, Detained, Ran away, Exploited, Gang) per
       staff request — see personSections(m, printOrder). */
    const violenceLine = pLine("Has this child/youth witnessed violence?", a.witnessed);
    const exploitedLine = pLine("Exploited (has been or is being)?", a.exploited);
    const gangLine = pLine("Involved with a gang?", a.gang);
    let courtBlock = pLine("Is this child/youth involved in court", a.court);
    if(a.court==="Yes") courtBlock += pFree("Which court? (also enter in S5)", a.courtWhich);
    let detainedBlock = pLine("Ever been detained by the police or arrested?", a.detained);
    if(a.detained==="Yes") detainedBlock += pLine("Detained for what reason?", a.detainedReason);
    let ranAwayBlock = pLine("Ever run away?", a.ranAway);
    if(a.ranAway==="Yes") ranAwayBlock += pFree("How many times?", a.ranTimes) +
      pFree("When was the last time?", a.ranWhen) + pFree("For how long?", a.ranHowLong);
    s3 += printOrder
      ? (violenceLine + courtBlock + detainedBlock + ranAwayBlock + exploitedLine + gangLine)
      : (violenceLine + exploitedLine + gangLine + courtBlock + detainedBlock + ranAwayBlock);
    S.push({title:"S3 — Safety", range:[9,11], inner:s3});
    let s4 = pLine("Is this child/youth currently living with their family?", a.livingWithFamily);
    if(a.livingWithFamily==="No"){
      s4 += pFree("If no, who is the child/youth living with?", a.livingWith) +
        '<div class="p-staff">Staff: on the Contact Information tab, set \u201CInformation Different from Primary Contact\u201D = Yes.</div>';
    }
    s4 += pLine("Food", a.s4food) + pLine("Clothing", a.s4clothing);
    S.push({title:"S4 — Basic Needs", range:[12,12], inner:s4});
    let s5 = pChecks("Agencies (check all that apply)", a.agencies);
    s5 += pLine("Court", a.court==="Yes"?"Yes (checked)":(a.court||"Did Not Answer"));
    if(a.court==="Yes") s5 += pFree("Which court? (from S3)", a.courtWhich);
    const comm=(a.community||[]).filter(x=>x&&x.trim());
    s5 += pLine("Other community agencies / city-town resources?", a.communityFlag) +
      pFree("Listed", comm.length?comm.join("; "):"—");
    S.push({title:"S5 — Agency Involvement", range:[13,13], inner:s5});
    S.push({title:"S6 — Civic Engagement", range:[14,14], inner:
      pChecks("Involved with (check all that apply)", a.civic)});
  }
  return S;
}

/* ---- Review & edit screen ---- */
SCREENS.review = (ctx) => {
  const m = state.members.find(x=>x.id===ctx.mid);
  PS_TR = true;                    /* review renders in the current language */
  const secs = personSections(m);
  PS_TR = false;
  const body = [el("p",{class:"hint"},"Review the answers below. Tap \u201CEdit\u201D on any section to change it.")];
  for(const s of secs){
    const head = el("div",{class:"rev-head"},
      el("h3",null,tr(s.title)),
      el("button",{class:"btn-quiet", type:"button", style:"padding:8px 14px; font-size:14px;",
        onclick:()=>{
          if(s.range==="basics") goTo("basics",{mid:m.id, returnTo:"review", returnMid:m.id});
          else goTo("intake",{mid:m.id, step:s.range[0], editEnd:s.range[1]});
        }},"Edit"));
    const sec = el("div",{class:"rev-section"});
    sec.appendChild(head);
    const content = el("div",{html:s.inner});
    sec.appendChild(content);
    body.push(sec);
  }
  return shell({
    title:trn("Review — {n}", fullName(m)),
    body:body,
    next:()=>goTo("rosterSelect"),
    nextLabel:"Looks good",
    noBack:true
  });
};

/* ============ FINISH & PRINT ============ */
SCREENS.finish = () => {
  if(!state.showStaffPanel){
    /* Client-facing — no exit option at all. Only the plain staff-reveal button moves forward. */
    return shell({
      title:"All set!",
      body:[
        el("p",null,"Thanks for completing the intake. You shouldn't have to complete one again in the future! Give yourself a high five, and hand the tablet over to an FRC staff member to take care of the rest."),
      ],
      noBack:true,
      extraNav: el("button",{class:"btn-quiet", type:"button",
        onclick:()=>{ state.showStaffPanel=true; rerender(); }}, "Next steps")
    });
  }
  return shell({
    title:"Next steps",
    body:[
      el("div",{class:"notice"},"Staff: use Print to make the data-entry copy. Nothing is saved on this device — closing or refreshing this page erases everything, so print first."),
      state.submitStatus ? el("div",{class:"notice"}, state.submitStatus) : null,
    ],
    noBack:true,
    next: async ()=>{
      state.submitting = true;
      state.submitStatus = "Submitting…";
      rerender();
      const printHtml = buildPrint();
      const payload = {
        family: state.family,
        referral: state.referral,
        members: state.members,
        submittedAt: new Date().toISOString(),
        printHtml: printHtml
      };
      const outcome = await submitIntake(payload);
      state.submitting = false;
      state.submitStatus = outcome.success
        ? "Submitted."
        : "Submission failed — please try again or download/print a copy to send to the FRC.";
      rerender();
    },
    nextLabel: state.submitting ? "Submitting…" : "Submit",
    canNext: !state.submitting,
    extraNav: el("div",{style:"display:flex; gap:10px; flex-wrap:wrap; align-items:center;"},
      el("button",{class:"btn-ghost", type:"button", onclick:()=>goTo("rosterSelect")},"Edit"),
      el("button",{class:"btn-ghost", type:"button",
        onclick:()=>{ buildPrint(); window.print(); }},
        "Print"),
      el("button",{class:"btn-ghost", type:"button",
        onclick:()=>{
          let m1 = "Erase EVERYTHING and start a brand new intake?\n\nThis cannot be undone. Make sure you have printed first.";
          let m2 = "Are you sure? All answers will be permanently erased.";
          if(LANG==="es"){
            m1 += "\n\n¿BORRAR TODO y comenzar una admisión completamente nueva?\n\nEsto no se puede deshacer. Asegúrese de haber impreso primero.";
            m2 += "\n\n¿Está seguro/a? Todas las respuestas se borrarán permanentemente.";
          }
          if(confirm(m1)){ if(confirm(m2)) location.reload(); }
        }},
        "Start over (erase all)")
    )
  });
};

function miniCard(m){
  return '<div class="p-card">'+
    '<div class="p-card-name">'+esc(fullName(m)||"(no name)")+' — '+(isChild(m)?"Child":"Adult")+'</div>'+
    pLine("Last Name", m.last)+
    pFree("Preferred name", m.preferred)+
    pLine("Gender", genderOut(m))+
    pLine("Pronouns", pronounOut(m))+
    pLine("Health insurance", m.insurance)+
    pLine("First Name", m.first)+
    pLine("Birthday", dobOut(m))+
    pLine("Services needed", m.services?"Yes":"No")+
    '</div>';
}

function needsFor(m){
  const a = m.a||{};
  const who = isChild(m) ? "child" : "adult";
  const out = [];
  for(const t of NEEDS_TRIGGERS){
    if(t.who!=="any" && t.who!==who) continue;
    try{
      if(t.when(m,a)){
        const txt = (typeof t.need==="function") ? t.need(m,a) : t.need;
        out.push({group:t.group, txt:txt, bold:!!t.bold});
      }
    }catch(e){}
  }
  return out;
}

function formatPhonePrint(phone){
  const d = digitsOf(phone);
  return d.length===10 ? (d.slice(0,3)+"-"+d.slice(3,6)+"-"+d.slice(6)) : phone;
}

function buildPrint(){
  PS_TR = false;                   /* print is ALWAYS English for CRM entry */
  const f = state.family, ad = f.address;
  const kids = state.members.filter(m=>isChild(m)).length;
  let h = '<div class="p-title">Family Intake — '+esc(f.lastName||"(no family name)")+'</div>';
  h += '<div class="p-meta">Completed '+TODAY_STR+' · Printed from the intake tablet · Enter into CRM, then shred.</div>';

  h += '<div class="p-section"><h3>FAMILY — Family Information</h3>'+
    pLine("Family Last Name", f.lastName) +
    pLine("Household Type", f.householdType) +
    pFree("Main Phone", formatPhonePrint(f.phone)) +
    pFree("Email", f.email) +
    pLine("Your family is", f.living) +
    pLine("What is your total household income?", f.income) +
    pFree("Address 1: Street 1", ad.street) +
    pFree("Address 1: Street 2", ad.street2) +
    pFree("Apt. #", ad.apt) +
    pFree("City", ad.city) +
    pFree("State", ad.state) +
    pFree("Zip Code", ad.zip) +
    pLine("Total number of children/youth living in household (auto)", String(kids)) +
    pLine("Total number of household members (auto)", String(state.members.length)) +
    '</div>';

  h += '<div class="p-section"><h3>FAMILY — Referral Source (exactly one)</h3>'+
    pLine("How did you hear about us?", state.referral.value) +
    '<div class="p-line">Category chosen on tablet: '+esc(state.referral.category||"—")+'</div></div>';

  /* Family member mini-cards — quick reference for CRM entry */
  h += '<div class="p-section"><h3>FAMILY MEMBERS — quick reference (add each to CRM)</h3><div class="p-cards">';
  for(const m of state.members) h += miniCard(m);
  h += '</div></div>';

  /* Full pages: only people who completed/have services */
  for(const m of state.members){
    if(!m.services) continue;
    const child = isChild(m);
    h += '<div class="p-person">';
    h += '<div class="p-title">'+esc(fullName(m)||"(no name)")+(m.isSelf?" (completed own intake)":"")+(child?" — CHILD":" — ADULT")+'</div>';
    const secs = personSections(m, true);
    let screeningHeaderDone = false;
    for(const s of secs){
      /* insert screening header before S1 */
      if(!screeningHeaderDone && s.title.startsWith("S1")){
        h += '<div class="p-section"><h3>'+(child?"CHILD":"ADULT")+' SCREENING — Family Member Information</h3>'+
          pLine("Date", TODAY_STR) +
          '<div class="p-staff">Staff Completed: ______________________</div></div>';
        screeningHeaderDone = true;
      }
      h += '<div class="p-section"><h3>'+esc(s.title)+'</h3>'+s.inner+'</div>';
      if(m.isSelf && s.title==="Family Member Info — Demographics"){
        h += '<div class="p-section p-primary">Primary Contact: Yes - Select in CRM</div>';
      }
    }
    h += '</div>';
  }

  /* Needs & follow-ups box — per person, grouped by need type */
  let needsHtml = "";
  for(const m of state.members){
    const list = needsFor(m);
    const craFlag = isChild(m) && (m.a||{}).craActive==="Yes";
    if(!list.length && !craFlag) continue;
    needsHtml += '<div class="who">'+esc(fullName(m)||"(no name)")+'</div>';
    if(craFlag) needsHtml += '<div class="cra-flag">\u2610 IDENTIFIED AS CRA — PRESENT TO CLINICIAN</div>';
    for(const g of NEED_GROUPS){
      const items = list.filter(x=>x.group===g);
      if(!items.length) continue;
      needsHtml += '<h4>'+esc(g)+'</h4><ul>';
      for(const n of items) needsHtml += '<li'+(n.bold?' class="b"':'')+'>'+esc(n.txt)+'</li>';
      needsHtml += '</ul>';
    }
  }
  h += '<div class="p-needs"><h3>STAFF — NEEDS &amp; FOLLOW-UPS (do not skip)</h3>'+
    (needsHtml || '<div class="p-line">No triggered needs — confirm verbally before family leaves.</div>')+
    '<div class="p-mfb">Consider MyFriendBen and the satisfaction survey where appropriate.</div>'+
    '</div>';

  /* Releases of Information — bold, do not miss */
  let roiHtml = "";
  for(const m of state.members){
    if(!(m.services && m.done)) continue;
    const name = esc(fullName(m)||"(no name)");
    const a = m.a||{};
    roiHtml += '<div class="p-roi-line">\u2610 '+name+' - CFFS/JRI</div>';
    for(const ag of RELEASE_AGENCIES){
      if((a.agencies||[]).includes(ag)){
        roiHtml += '<div class="p-roi-line">\u2610 '+name+' - '+esc(ag.split(" ")[0])+'</div>';
      }
    }
    for(const c of (a.community||[])){
      if(c && c.trim()) roiHtml += '<div class="p-roi-line">\u2610 '+name+' - '+esc(c.trim())+'</div>';
    }
    if(isChild(m)) roiHtml += '<div class="p-roi-line">\u2610 '+name+' - School release</div>';
  }
  h += '<div class="p-roi"><h3>RELEASES OF INFORMATION NEEDED</h3>'+
    (roiHtml || '<div class="p-roi-line">(no completed intakes)</div>')+'</div>';

  if((state.notesText||"").trim()){
    h += '<div class="p-section"><h3>NOTES</h3><div class="p-line">'+
      esc(state.notesText).replace(/\n/g,'<br>')+'</div></div>';
  }

  document.getElementById("printRoot").innerHTML = h;
  return h;
}

/* ============ NOTES WIDGET (persistent floating note, all screens) ============
   Built once, outside the #app render cycle, so it survives every screen
   navigation untouched. State lives in state.notesText; open/closed state
   is plain DOM (not reset by navigation) and starts collapsed. */
const notesTextarea = el("textarea",{id:"notesTextarea"});
notesTextarea.value = state.notesText;
notesTextarea.addEventListener("input", ()=>{ state.notesText = notesTextarea.value; });
const notesFab = el("button",{class:"notes-fab", type:"button",
  onclick:()=>{ notesPanel.classList.add("open"); notesFab.style.display="none"; notesTextarea.focus(); }});
const notesHeadLabel = el("span");
const notesCloseBtn = el("button",{type:"button", "aria-label":"Close",
  onclick:()=>{ notesPanel.classList.remove("open"); notesFab.style.display=""; }}, "✕");
const notesPanel = el("div",{class:"notes-panel"},
  el("div",{class:"notes-panel-head"}, notesHeadLabel, notesCloseBtn),
  notesTextarea);
document.body.appendChild(notesFab);
document.body.appendChild(notesPanel);
function syncNotesI18n(){
  notesFab.textContent = tr("Notes");
  notesHeadLabel.textContent = tr("Notes");
  notesTextarea.placeholder = tr("Optional — use this space for any additional information");
}
syncNotesI18n();

/* ============ INIT ============ */
goTo("welcome");
</script>
</body>
</html>
